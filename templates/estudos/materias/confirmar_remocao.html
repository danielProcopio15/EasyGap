{% extends "base.html" %}
{% block title %}Remover — EASYgap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-20">
    <p class="text-5xl mb-6">⚠️</p>
    <h1 class="text-2xl font-bold text-white mb-2">Confirmar remoção</h1>
    <p class="text-gray-400 mb-8">
        Tem certeza que deseja remover <span class="text-white font-semibold">{{ objeto }}</span>?
        Esta ação não pode ser desfeita.
    </p>
    <form method="post" class="flex gap-4 justify-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, remover</button>
        <a href="javascript:history.back()" class="btn btn-ghost">Cancelar</a>
    </form>
</div>
{% endblock %}
